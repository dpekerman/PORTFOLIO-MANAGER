name: CD – Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Pre-flight: skip entire CD gracefully when Azure secrets are not yet configured ──
  preflight:
    name: Check Azure secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify required secrets exist
        id: check
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$PUBLISH_PROFILE" ] && [ -n "$SWA_TOKEN" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✅ Azure secrets found — proceeding with deployment"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "⏭️  Azure secrets not configured yet — skipping deployment (Phase 4 of cloud-migration-guide.md)"
          fi

  # ── Backend: build + deploy to Azure App Service ───────────────────────────
  deploy-backend:
    name: Deploy .NET 8 API → App Service
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API
        working-directory: backend/PortfolioManager.Api
        run: dotnet publish --configuration Release --output ${{ github.workspace }}/publish/api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: portfolio-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish/api

  # ── Frontend: build + deploy to Azure Static Web Apps ─────────────────────
  deploy-frontend:
    name: Deploy Angular 22 → Static Web Apps
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/portfolio-manager-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/portfolio-manager-ui
        run: npm ci

      - name: Production build
        working-directory: frontend/portfolio-manager-ui
        run: npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/portfolio-manager-ui
          output_location: dist/portfolio-manager-ui/browser
          skip_app_build: true

