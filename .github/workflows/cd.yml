name: CD – Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Pre-flight: skip entire CD gracefully when Azure secrets are not yet configured ──
  preflight:
    name: Check Azure secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify required secrets exist
        id: check
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$PUBLISH_PROFILE" ] && [ -n "$SWA_TOKEN" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✅ Azure secrets found — proceeding with deployment"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "⏭️  Azure secrets not configured yet — skipping deployment (Phase 4 of cloud-migration-guide.md)"
          fi

  # ── Backend: build + deploy to Azure App Service ───────────────────────────
  deploy-backend:
    name: Deploy .NET 8 API → App Service
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API
        working-directory: backend/PortfolioManager.Api
        run: dotnet publish --configuration Release --output ${{ github.workspace }}/publish/api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: portfolio-manager
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish/api

      - name: Set email App Password in App Service
        if: ${{ secrets.EMAIL_APP_PASSWORD != '' }}
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          EMAIL_PWD: ${{ secrets.EMAIL_APP_PASSWORD }}
        # Uses Kudu REST API with publish-profile credentials — no service principal needed
        run: |
          KUDU_USER=$(echo "$PUBLISH_PROFILE" | grep -o 'userName="[^"]*"' | head -1 | sed 's/userName="//;s/"//')
          KUDU_PASS=$(echo "$PUBLISH_PROFILE" | grep -o 'userPWD="[^"]*"'  | head -1 | sed 's/userPWD="//;s/"//')
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://portfolio-manager-f8e7evc3e9feb2hm.scm.canadacentral-01.azurewebsites.net/api/settings" \
            -H "Content-Type: application/json" \
            -u "$KUDU_USER:$KUDU_PASS" \
            -d "{\"EmailNotification__Password\": \"$EMAIL_PWD\"}")
          echo "Kudu settings API response: $HTTP"
          [ "$HTTP" = "204" ] && echo "✅ Email password updated" || echo "⚠️  Unexpected status $HTTP"

  # ── Frontend: build + deploy to Azure Static Web Apps ─────────────────────
  deploy-frontend:
    name: Deploy Angular 22 → Static Web Apps
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install and build Angular
        working-directory: frontend/portfolio-manager-ui
        run: npm install && npx ng build --configuration production

      # app_location points directly at the pre-built output so skip_app_build is unambiguous
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/portfolio-manager-ui/dist/portfolio-manager-ui/browser
          output_location: ""
          skip_app_build: true
