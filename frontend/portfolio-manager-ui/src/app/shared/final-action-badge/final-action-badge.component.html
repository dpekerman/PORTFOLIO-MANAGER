<button
  type="button"
  class="fa-badge"
  [class]="'fa-badge ' + (bucket() ?? 'ma-standby')"
  [class.fa-badge-inert]="disabled()"
  [matTooltip]="tooltip()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  data-testid="final-action-badge"
  (click)="onClick()"
>
  {{ label() }}
</button>
