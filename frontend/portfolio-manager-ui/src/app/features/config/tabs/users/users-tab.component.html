<app-settings-section
  icon="manage_accounts"
  title="User Management"
  subtitle="Create and manage application users. Only Admins can access this section."
>
  <div class="section-body">
    <div class="alloc-table-header">
      <button
        mat-flat-button
        color="primary"
        (click)="openCreateUserDialog()"
        [disabled]="savingUser()"
      >
        <mat-icon>person_add</mat-icon> Add User
      </button>
      <button
        mat-icon-button
        matTooltip="Refresh user list"
        (click)="loadUsers()"
        [disabled]="loadingUsers()"
      >
        <mat-icon [class.spinning]="loadingUsers()">refresh</mat-icon>
      </button>
    </div>

    @if (loadingUsers()) {
      <p class="hint-text">Loading users…</p>
    } @else if (userList().length === 0) {
      <p class="hint-text">No users found.</p>
    } @else {
      <div class="user-table">
        <div class="user-table-header">
          <span>Display Name</span>
          <span>Email</span>
          <span>Role</span>
          <span></span>
        </div>
        @for (user of userList(); track user.id) {
          <div class="user-table-row">
            <span class="user-name">{{ user.displayName }}</span>
            <span class="user-email">{{ user.email }}</span>
            <mat-form-field appearance="outline" class="role-select">
              <mat-select
                [value]="user.roles[0]"
                (selectionChange)="changeUserRole(user.id, $event.value)"
              >
                @for (role of availableRoles; track role) {
                  <mat-option [value]="role">{{ role }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
            <button
              mat-icon-button
              color="warn"
              matTooltip="Delete user"
              (click)="confirmDeleteUser(user.id, user.displayName)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        }
      </div>
    }
  </div>
</app-settings-section>
