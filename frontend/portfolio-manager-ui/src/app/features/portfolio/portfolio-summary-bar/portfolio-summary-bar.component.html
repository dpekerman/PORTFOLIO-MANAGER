<div class="summary-bar">
  <div class="summary-tile">
    <span class="label">Portfolio Value</span>
    <span class="value primary" [class.demo-redact]="demoMode.isDemoMode()">{{
      totalValue() | currency
    }}</span>
  </div>
  <div class="summary-tile">
    <span class="label">1 Day Change</span>
    @let dayChange = oneDayChange();
    <span
      class="value"
      [class.positive]="dayChange !== null && dayChange > 0"
      [class.negative]="dayChange !== null && dayChange < 0"
      [class.demo-redact]="demoMode.isDemoMode()"
    >
      @if (oneDayChangeLoading()) {
        <span class="dim">—</span>
      } @else if (dayChange !== null) {
        {{ dayChange >= 0 ? '+' : '' }}{{ dayChange | currency }}
      } @else {
        <span class="dim">—</span>
      }
    </span>
  </div>
  <div
    class="summary-tile"
    matTooltip="Stocks: {{ stockState.summaries().length }} · Cash: {{
      cashState.items().length
    }} · Options: {{ optionState.items().length }}"
  >
    <span class="label">Positions</span>
    <span class="value">{{ totalPositions() }}</span>
  </div>
</div>
