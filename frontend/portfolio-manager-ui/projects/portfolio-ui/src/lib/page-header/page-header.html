<header class="page-header">
  <div class="page-header__identity">
    <ng-content select="[uiPageHeaderLeading]" />
    <div class="page-header__copy">
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
  </div>
  <div class="page-header__actions">
    <ng-content select="[uiPageHeaderActions]" />
  </div>
</header>
